.streifen .grund{position:absolute;right:0;top:0;bottom:0;width:62%;
   background:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.72) 30%,rgba(255,255,255,.95) 58%,#fff 100%)}
.streifen h1{position:absolute;right:calc(2.4 * var(--u) * 16 / 9);bottom:calc(1.2 * var(--u));margin:0;font-family:var(--hand);white-space:nowrap;
             font-size:calc(calc(6.4 * var(--u)) * var(--k));font-weight:400;line-height:1}
.streifen h1 em{font-style:normal;font-size:.56em;color:var(--matt);margin-left:calc(1 * var(--u) * 16 / 9)}
main{flex:1;min-height:0;display:grid;grid-template-columns:auto 1fr;gap:calc(2.4 * var(--u));padding:calc(2.6 * var(--u)) calc(2.6 * var(--u) * 16 / 9)}
.karte{background:var(--karte);border:1px solid var(--linie);border-radius:16px;padding:calc(2.2 * var(--u) * var(--s)) calc(2 * var(--u) * 16 / 9)}
/* Timer */
.uhren{display:flex;gap:calc(2.4 * var(--u));min-height:0}
.timer{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(1.6 * var(--u));padding:calc(2.2 * var(--u)) calc(2 * var(--u) * 16 / 9);width:calc(54 * var(--u))}
.ring{position:relative;width:calc(46 * var(--u));height:calc(46 * var(--u))}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bahn{stroke:var(--creme)}
.ring .rest{stroke:var(--gruen);stroke-linecap:round;transition:stroke-dashoffset .5s linear,stroke .5s}
.ring .zahl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .zahl b{font-size:calc(11 * var(--u));font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.ring .zahl span{font-family:var(--hand);font-size:calc(3 * var(--u));color:var(--matt);margin-top:calc(.6 * var(--u))}
.knoepfe{display:flex;gap:calc(1 * var(--u));opacity:0;transition:opacity .3s}
.timer:hover .knoepfe{opacity:1}
.knoepfe button{font:600 calc(2.8 * var(--u)) var(--druck);color:var(--tinte);background:var(--creme);border:1px solid var(--linie);
   border-radius:10px;padding:calc(1 * var(--u)) calc(1.8 * var(--u));cursor:pointer}
.knoepfe button:hover{border-color:var(--tinte)}
.knoepfe .start{background:var(--gruen);color:#fff;border-color:var(--gruen);min-width:calc(12 * var(--u))}
/* Mehrere Uhren (verschiedene Dauern): kleiner, nebeneinander, darunter gross, wen sie betreffen */
body.mehrere .timer{width:calc(33 * var(--u));padding:calc(2 * var(--u)) calc(1.2 * var(--u) * 16 / 9);gap:calc(1.4 * var(--u))}
body.mehrere .ring{width:calc(28 * var(--u));height:calc(28 * var(--u))}
body.mehrere .ring .zahl b{font-size:calc(6.6 * var(--u))}
body.mehrere .ring .zahl span{font-size:calc(2.4 * var(--u))}
body.mehrere .knoepfe{gap:calc(.6 * var(--u))}
body.mehrere .knoepfe button{font-size:calc(2.1 * var(--u));padding:calc(.8 * var(--u)) calc(1.1 * var(--u))}
body.mehrere .knoepfe .start{min-width:calc(8 * var(--u))}
.wer{display:flex;flex-wrap:wrap;justify-content:center;gap:calc(.6 * var(--u)) calc(1.2 * var(--u))}
.oben{display:flex;gap:calc(2.4 * var(--u));min-height:0}
/* Drei Uhren: eine Reihe oben (Uhr links, Kuerzel rechts daneben), darunter die ganze Breite fuer Infos */
body.drei main{grid-template-columns:1fr;grid-template-rows:auto 1fr}
body.drei .uhren{flex:1}
body.drei .timer{flex:1;width:auto;display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;
   align-items:center;justify-items:start;column-gap:calc(1.6 * var(--u) * 16 / 9);row-gap:calc(.8 * var(--u));padding:calc(1.6 * var(--u)) calc(1.4 * var(--u) * 16 / 9)}
body.drei .ring{width:calc(23 * var(--u));height:calc(23 * var(--u));grid-row:1 / 3}
body.drei .ring .zahl b{font-size:calc(5.6 * var(--u))}
body.drei .ring .zahl span{font-size:calc(2.1 * var(--u))}
body.drei .wer{flex-direction:column;align-items:flex-start;justify-content:center}
body.drei .wer span{font-size:calc(3.2 * var(--u))}
body.drei .knoepfe{flex-wrap:wrap;max-width:calc(18 * var(--u))}
body.drei .zeit{flex-direction:column;align-items:flex-start;justify-content:center;gap:calc(1 * var(--u));padding:calc(1.6 * var(--u)) calc(1.6 * var(--u) * 16 / 9)}
body.drei .zeit .jetzt{font-size:calc(8 * var(--u))}
body.drei .zeit .slot{text-align:left;font-size:calc(3 * var(--u))}
body.drei .zeit .slot b{font-size:calc(2.8 * var(--u))}
body.drei .infos ul{display:block;columns:2;column-gap:calc(3 * var(--u) * 16 / 9)}
body.drei .infos li{break-inside:avoid;margin-bottom:calc(1.4 * var(--u) * var(--s))}
.wer span{font-weight:600;font-size:calc(3.4 * var(--u));line-height:1.1;color:var(--m);border-bottom:calc(.5 * var(--u)) solid var(--m)}
/* rechte Spalte: alles in sh, damit sie als Ganzes schrumpfen kann */
.rechts{display:flex;flex-direction:column;gap:calc(2.4 * var(--u) * var(--s));min-height:0;min-width:0}
.zeit{display:flex;align-items:baseline;justify-content:space-between;gap:calc(2 * var(--u) * 16 / 9)}
.zeit .jetzt{font-size:calc(9 * var(--u) * var(--s));font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.zeit .slot{text-align:right;font-family:var(--hand);font-size:calc(3.4 * var(--u) * var(--s));color:var(--matt);line-height:1.15}
.zeit .slot b{font-family:var(--druck);font-weight:600;color:var(--tinte);font-size:calc(3.2 * var(--u) * var(--s))}
.platz{background:var(--creme);border-radius:16px;padding:calc(2 * var(--u) * var(--s)) calc(2 * var(--u) * 16 / 9);font-size:calc(3.9 * var(--u) * var(--s));line-height:1.3}
.platz b{font-weight:600}
.infos{display:grid;gap:calc(2.4 * var(--u) * var(--s));flex:1;min-height:0;grid-auto-flow:column;grid-auto-columns:1fr}
.infos .karte{display:flex;flex-direction:column;border-top:7px solid var(--m);min-width:0}
.infos h2{font-family:var(--hand);font-weight:400;font-size:calc(4.8 * var(--u) * var(--s));margin:0 0 calc(1.4 * var(--u) * var(--s));line-height:1;color:var(--m)}
ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(1.4 * var(--u) * var(--s))}
li{font-size:calc(3.7 * var(--u) * var(--s));line-height:1.3;padding-left:1.3em;position:relative}
li::before{content:"✓";position:absolute;left:0;color:var(--gruen);font-weight:600}
li.nein::before{content:"✗";color:var(--rot)}
li.hinweis::before{content:"→";color:var(--matt)}
li b{font-weight:600}
/* Ab drei Pruefungen: ein Kasten fuer alle, Besonderes mit dem Kuerzel markiert */
.infos .karte.alle{--m:var(--matt)}
li .tag{font-weight:600;color:#fff;background:var(--m);border-radius:6px;padding:0 .35em;margin-right:.35em;font-size:.82em;white-space:nowrap}
/* Pruefungen im Block, ab drei Pruefungen mit einer gemeinsamen Uhr */
.module{display:flex;flex-wrap:wrap;gap:calc(1 * var(--u) * var(--s)) calc(1 * var(--u) * 16 / 9)}
.module > span{background:var(--karte);border:1px solid var(--linie);border-left:6px solid var(--m);border-radius:10px;
   padding:calc(.8 * var(--u) * var(--s)) calc(1 * var(--u) * 16 / 9);font-size:calc(3.2 * var(--u) * var(--s));white-space:nowrap}
.module b{font-weight:600;color:var(--m)}
.marke{font-weight:600;border:2px solid var(--tinte);border-radius:6px;padding:0 .3em;white-space:nowrap}
.fuss{font-size:calc(3 * var(--u) * var(--s));display:flex;gap:calc(1.2 * var(--u) * 16 / 9);row-gap:calc(1 * var(--u) * var(--s));flex-wrap:wrap}
.fuss > span{background:var(--karte);border:1px solid var(--linie);border-radius:12px;padding:calc(1 * var(--u) * var(--s)) calc(1.3 * var(--u) * 16 / 9)}
.leer{display:none !important}
/* Zahnrad: unsichtbar, bis die Maus in die Ecke faehrt */
.zahnrad{position:absolute;top:0;right:0;width:calc(8 * var(--u));height:calc(8 * var(--u));display:grid;place-items:center;
   font-size:calc(4 * var(--u));color:var(--matt);background:rgba(255,255,255,.85);border:0;border-bottom-left-radius:16px;
   cursor:pointer;opacity:0;transition:opacity .3s;z-index:5}
.zahnrad:hover,.zahnrad:focus-visible{opacity:1}
</style>

.block{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;padding:8px 0;border-bottom:1px dashed var(--linie)}

button.d{font:600 14px var(--druck);color:var(--tinte);background:var(--creme);border:1px solid var(--linie);border-radius:8px;padding:6px 12px;cursor:pointer}

.meldung{color:var(--rot);font-size:13px;margin-right:auto;align-self:center}

tifte, Lineal, Geodreieck, Zirkel"},{"art":"ja","text":"Taschenrechner"},{"art":"ja","text":"zusätzlich: Formelblatt A4, einseitig, handgeschrieben"}],"id":"s1b"},{"kuerzel":"Sek I c","name":"Sek I anderes Semester A","farbe":"#007d57","dauer":null,"hilfsmittel":[{"art":"ja","text":"Stifte, Lineal, Geodreieck, Zirkel"},{"art":"ja","text":"Taschenrechner"},{"art":"nein","text":"keine Unterlagen"}],"id":"s1c"},{"kuerzel":"Sek I d","name":"Sek I anderes Semester B","farbe":"#a6083d","dauer":null,"hilfsmittel":[{"art":"ja","text":"Stifte, Lineal, Geodreieck, Zirkel"},{"art":"ja","text":"Taschenrechner"}],"id":"s1d"},{"kuerzel":"GJ a","name":"Grundjahr","farbe":"#935100","dauer":60,"hilfsmittel":[{"art":"ja","text":"Stifte, Lineal, Geodreieck, Zirkel"},{"art":"nein","text":"kein Taschenrechner"}],"id":"gja"},{"kuerzel":"GJ b","name":"Grundjahr, anderes Semester","farbe":"#6a1b9a","dauer":60,"hilfsmittel":[{"art":"ja","text":"Stifte, Lineal, Geodreieck, Zirkel"},{"art":"nein","text":"kein Taschenrechner"}],"id":"gjb"},{"kuerzel":"Prim","name":"Primarstufe","farbe":"#2e7d32","dauer":45,"hilfsmittel":[{"art":"ja","text":"Stifte, Lineal, Geodreieck, Zirkel"},{"art":"ja","text":"Taschenrechner"}],"id":"pri"}],"bloecke":[{"datum":"","von":"10:15","bis":"11:45","dauer":null,"module":["s1a","s1b","s1c","s1d","gja","gjb","pri"]}],"satzEins":"Setzen Sie sich an einen Platz, an dem **Prüfungsblätter liegen**.","satzMehrere":"Setzen Sie sich an einen Platz mit den **passenden Prüfungsblättern**. {module} sitzen abwechselnd.","kaertchen":["Jedes Blatt: [Name · A1 · S. 2/3]","Handy in die Tasche","Getränke und Snacks erlaubt"]}]</script>
<script>
// Die Seite, wie sie geladen wurde - vor jedem Rendern abgegriffen. Daraus entsteht «Als Datei speichern».
const ROH = '<!doctype html>\n' + document.documentElement.outerHTML;
const $ = id => document.getElementById(id);
const json = id => JSON.parse($(id).textContent);
const VORDRUCKE = json('vordrucke'), VORGABE = json('vorgabe');
// Je Vordruck ein eigener Speicher, damit Teil A und Teil B sich nicht gegenseitig ueberschreiben.
const SPEICHER = 'frieder-beamer-pruefung:' + (VORGABE.vordruck || 'eigen');
const kopie = o => JSON.parse(JSON.stringify(o));

// ---------- Einstellungen laden und merken ----------
// Gespeichert wird mit der ID der Vorgabe: Auf file:// teilen sich alle Dateien denselben Speicher,
// eine verschickte Datei mit neuer Vorgabe soll nicht von alten Einstellungen ueberschrieben werden.
function laden(){
  try {
    const g = JSON.parse(localStorage.getItem(SPEICHER));
    if (g && g.vorgabeId === VORGABE.id && g.einstellungen) return g.einstellungen;
  } catch (e) {}
  return kopie(VORGABE.einstellungen);
}
// Beispielmodus (Beispiele.html): ein erfundener Fall, nichts wird gemerkt.
const BEISPIEL = json('beispiele')[new URLSearchParams(location.search).get('beispiel') - 1];
let E = BEISPIEL ? kopie(BEISPIEL) : laden();
function merken(){
  if (BEISPIEL) return;
  try { localStorage.setItem(SPEICHER, JSON.stringify({vorgabeId: VORGABE.id, einstellungen: E})); $('meldung') && ($('meldung').textContent = ''); }
  catch (e) { $('meldung') && ($('meldung').textContent = 'Konnte nicht im Browser gemerkt werden. «Als Datei speichern» geht trotzdem.'); }
}

// ---------- Zeit ----------
// Testhaken: ?uhr=15:20 und ?datum=2026-10-30 verschieben die Uhr; sie laeuft von dort weiter.
const q = new URLSearchParams(location.search);
let versatz = 0;
if (q.get('uhr') || q.get('datum')) {
  const d = new Date(), [h, m] = (q.get('uhr') || `${d.getHours()}:${d.getMinutes()}`).split(':').map(Number);
  const z = q.get('datum') ? new Date(q.get('datum') + 'T00:00') : new Date(d);
  z.setHours(h, m, 0, 0); versatz = z - d;
}
const jetzt = () => new Date(Date.now() + versatz);
const zwei = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${zwei(d.getMonth()+1)}-${zwei(d.getDate())}`;
const hhmm = d => `${zwei(d.getHours())}:${zwei(d.getMinutes())}`;
const minuten = t => { if (!t) return null; const [h, m] = t.split(':').map(Number); return h*60 + m; };
const punkt = t => (t || '').replace(':', '.');

function dauer(b){
  if (b && b.dauer > 0) return b.dauer;
  if (b && b.von && b.bis && minuten(b.bis) > minuten(b.von)) return minuten(b.bis) - minuten(b.von);
  return 90;
}
// Eine Pruefung kann laenger oder kuerzer dauern als ihr Block. Jede Dauer bekommt eine eigene Uhr.
const modulDauer = (m, b) => m.dauer > 0 ? m.dauer : dauer(b);
function imBlock(i){
  const b = E.bloecke[i];
  return b && b.module.length ? E.module.filter(m => b.module.includes(m.id)) : E.module;
}
function dauernIm(i){
  const b = E.bloecke[i], mods = imBlock(i);
  return [...new Set(mods.length ? mods.map(m => modulDauer(m, b)) : [dauer(b)])].sort((x, y) => x - y);
}
// Aendert sich das, werden die Uhren neu gebaut (nur wenn keine laeuft).
const uhrenSchluessel = i => JSON.stringify([i, dauer(E.bloecke[i]), imBlock(i).map(m => [m.kuerzel, m.farbe, modulDauer(m, E.bloecke[i])])]);

let gewaehlt = null;   // Index des per Taste gewaehlten Blocks, null = nach Uhrzeit
function aktuellerBlock(){
  const B = E.bloecke;
  if (!B.length) return -1;
  if (gewaehlt !== null && B[gewaehlt]) return gewaehlt;
  const d = jetzt(), heute = iso(d), m = d.getHours()*60 + d.getMinutes();
  const nachZeit = (a, b) => (B[a].datum || '').localeCompare(B[b].datum || '') || (minuten(B[a].von) ?? 0) - (minuten(B[b].von) ?? 0);
  const alle = B.map((_, i) => i).sort(nachZeit);
  const heutige = alle.filter(i => !B[i].datum || B[i].datum === heute);
  // Der Block, der gerade laeuft oder als naechster kommt. Nach dem letzten des Tages kommt der
  // naechste an einem spaeteren Tag; gibt es keinen, bleibt der letzte stehen.
  const offen = heutige.find(i => m < (minuten(B[i].bis) ?? 24*60));
  if (offen !== undefined) return offen;
  return alle.find(i => B[i].datum > heute) ?? heutige.at(-1) ?? alle.at(-1);
}

// ---------- Darstellung ----------
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// **fett**, [Kaestchen] und ein fuehrendes «zusaetzlich:» werden hervorgehoben.
const auszeichnen = s => esc(s)
  .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
  .replace(/\[(.+?)\]/g, '<span class="marke">$1</span>')
  .replace(/^(zusätzlich:)/i, '<b>$1</b>');
const liste = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ' und ' + a.at(-1);

let blockJetzt = null, modsJetzt = [];
function zeichneSeite(){
  const i = aktuellerBlock(), b = E.bloecke[i];
  const mods = modsJetzt = imBlock(i), viele = mods.length > 2;

  // Bei mehr als zwei Pruefungen stehen die Namen nicht mehr im Kopf, sondern in der Modulzeile.
  const namen = viele ? '' : mods.map(m => m.name).filter(Boolean).join(' · ');
  $('titel').innerHTML = esc(E.titel) + (namen ? `<em>${esc(namen)}</em>` : '');
  document.title = (E.titel || 'Prüfung') + (namen ? ' – ' + namen : '');

  // Bei mehreren Uhren stehen die Kuerzel unter den Uhren, die Modulzeile entfaellt.
  const eineUhr = dauernIm(i).length < 2;
  $('module').innerHTML = mods.map(m => `<span style="--m:${esc(m.farbe)}"><b>${esc(m.kuerzel)}</b> ${esc(m.name)}</span>`).join('');
  $('module').classList.toggle('leer', !(viele && eineUhr));

  // Liegt der Block an einem anderen Tag, steht das Datum dabei.
  const tag = b && b.datum && b.datum !== iso(jetzt())
    ? new Date(b.datum + 'T00:00').toLocaleDateString('de-CH', {weekday: 'short', day: '2-digit', month: '2-digit'}) + ' · ' : '';
  $('slot').innerHTML = b && (b.von || b.bis) ? `Prüfung<br><b>${tag}${punkt(b.von)}–${punkt(b.bis)}</b>` : '';
  const satz = (mods.length > 1 ? E.satzMehrere : E.satzEins) || '';
  $('platz').innerHTML = auszeichnen(satz).replace('{module}', esc(liste(mods.map(m => m.kuerzel || m.name))));
  $('platz').classList.toggle('leer', !satz.trim());

  const eintraege = m => m.hilfsmittel.filter(h => h.text.trim());
  const li = (h, tag) => `<li class="${h.art}">${tag || ''}${auszeichnen(h.text)}</li>`;
  if (viele) {
    // Ein Kasten: was alle gemeinsam haben, einmal; der Rest mit dem Kuerzel der Pruefung davor.
    const schluessel = h => h.art + '|' + h.text.trim().toLowerCase();
    const gemeinsam = eintraege(mods[0]).filter(h => mods.every(m => eintraege(m).some(x => schluessel(x) === schluessel(h))));
    const g = new Set(gemeinsam.map(schluessel));
    // Gleiche Sonderregel bei mehreren Pruefungen: eine Zeile, mehrere Kuerzel davor.
    const gruppen = new Map();
    for (const m of mods) for (const h of eintraege(m)) {
      const k = schluessel(h);
      if (g.has(k)) continue;
      if (!gruppen.has(k)) gruppen.set(k, {h, tags: []});
      gruppen.get(k).tags.push(`<span class="tag" style="--m:${esc(m.farbe)}">${esc(m.kuerzel || m.name)}</span>`);
    }
    const besonders = [...gruppen.values()].map(({h, tags}) => li(h, tags.join('')));
    $('infos').innerHTML = gemeinsam.length + besonders.length ? `
      <section class="karte alle"><h2>Hilfsmittel</h2><ul>${gemeinsam.map(h => li(h)).join('')}${besonders.join('')}</ul></section>` : '';
  } else {
    $('infos').innerHTML = mods.filter(m => eintraege(m).length).map(m => `
      <section class="karte" style="--m:${esc(m.farbe)}"><h2>${mods.length > 1 ? esc([m.kuerzel, m.name].filter(Boolean).join(' ')) : 'Hilfsmittel'}</h2><ul>
        ${eintraege(m).map(h => li(h)).join('')}
      </ul></section>`).join('');
  }

  $('fuss').innerHTML = E.kaertchen.filter(k => k.trim()).map(k => `<span>${auszeichnen(k)}</span>`).join('');
  $('fuss').classList.toggle('leer', !E.kaertchen.some(k => k.trim()));

  // Neuer Block: Timer auf dessen Laenge stellen, aber nie einen laufenden Timer anfassen.
  // Neue Uhren nur, wenn keine laeuft. Laeuft eine, holt uhr() das nach, sobald sie steht.
  blockJetzt = uhrenSchluessel(i);
  if (blockJetzt !== uhrenFuer && !takt) neuerTimer();
  zeichneTimer();
  einpassen();
}

// Die rechte Spalte verkleinert sich, bis nichts mehr ueberlaeuft (Inhalt ist frei waehlbar).
function laeuftUeber(el){ return el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1; }
function einpassen(){
  const r = $('rechts'), body = document.body, pruefe = () => [r, ...r.querySelectorAll('.karte, .infos, .platz, .fuss')].some(laeuftUeber);
  let lo = .4, hi = 1;
  body.style.setProperty('--s', 1);
  if (pruefe()) {
    for (let n = 0; n < 9; n++) { const mid = (lo + hi) / 2; body.style.setProperty('--s', mid); pruefe() ? hi = mid : lo = mid; }
    body.style.setProperty('--s', lo);
  }
  // Titel im Kopfstreifen: hoechstens 90 % der Breite
  const h = $('titel'), w = $('streifen').clientWidth * .9;
  body.style.setProperty('--k', 1);
  if (h.offsetWidth > w) body.style.setProperty('--k', Math.max(.4, w / h.offsetWidth));
}
addEventListener('resize', einpassen);
document.fonts && document.fonts.ready.then(einpassen);

// ---------- Timer ----------
// Eine Uhr je Dauer; Pruefungen gleicher Dauer teilen sich eine. Alle starten gemeinsam,
// -1/+1 verschiebt nur die eigene Uhr. Gerechnet wird gegen die laengste Dauer (basis).
let uhren = [], rest = 5400, basis = 5400, ende = null, takt = null, gestartet = false;
let uhrenFuer = null;     // Block, fuer den die Uhren gebaut sind
let gekoppelt = true;     // Timer folgt der Uhrzeit des Blocks, bis jemand von Hand eingreift
let vorStart = null;      // Beginn des Blocks, solange er noch nicht angefangen hat
const mmss = s => { s = Math.max(0, Math.ceil(s)); return zwei(Math.floor(s/60)) + ':' + zwei(s%60); };
const knopfText = t => document.querySelectorAll('.timer .start').forEach(k => k.textContent = t);

function baueUhren(i){
  const b = E.bloecke[i], mods = imBlock(i), dauern = dauernIm(i), mehrere = dauern.length > 1;
  document.body.classList.toggle('mehrere', mehrere);
  // Ab drei Uhren wandert die Uhrzeit in die Reihe der Uhren; der Rest steht darunter.
  const drei = dauern.length > 2, zeit = document.querySelector('.zeit');
  document.body.classList.toggle('drei', drei);
  if (drei) $('uhren').after(zeit); else $('rechts').prepend(zeit);
  $('uhren').innerHTML = dauern.map((d, n) => `
    <section class="karte timer" data-n="${n}">
      <div class="ring">
        <svg viewBox="0 0 100 100"><circle class="bahn" cx="50" cy="50" r="45"/>
          <circle class="rest" cx="50" cy="50" r="45" pathLength="1000" stroke-dasharray="1000" stroke-dashoffset="0"/></svg>
        <div class="zahl"><b></b><span></span></div>
      </div>
      ${mehrere ? `<div class="wer">${mods.filter(m => modulDauer(m, b) === d).map(m => `<span style="--m:${esc(m.farbe)}">${esc(m.kuerzel || m.name)}</span>`).join('')}</div>` : ''}
      <div class="knoepfe">
        <button data-tat="minus" title="1 Minute weniger">−1</button>
        <button data-tat="start" class="start">Start</button>
        <button data-tat="plus" title="1 Minute mehr">+1</button>
        <button data-tat="zurueck" title="Alle Uhren zurück auf ihre Dauer">↺</button>
      </div>
    </section>`).join('');
  uhren = dauern.map((d, n) => {
    const el = $('uhren').children[n];
    return {dauer: d, extra: 0, ring: el.querySelector('.rest'), zahl: el.querySelector('.zahl b'), status: el.querySelector('.zahl span')};
  });
  basis = dauern.at(-1) * 60;
}
const restVon = u => (ende ? (ende - Date.now()) / 1000 : rest) - (basis - u.dauer * 60) + u.extra;

function zeichneTimer(){
  let alleUm = uhren.length > 0;
  for (const u of uhren) {
    const r = restVon(u), voll = Math.max(u.dauer * 60 + u.extra, 60);
    u.zahl.textContent = mmss(r);
    u.ring.style.strokeDashoffset = 1000 * (1 - Math.min(1, Math.max(0, r) / voll));
    u.ring.style.stroke = r <= 0 ? 'var(--rot)' : r <= 600 ? 'var(--orange)' : 'var(--gruen)';
    u.status.textContent = r <= 0 && gestartet ? 'Zeit ist um'
      : ende ? 'Ende ' + hhmm(new Date(Date.now() + r * 1000 + versatz))
      : gestartet ? 'angehalten' : vorStart ? 'Beginn ' + vorStart : 'bereit';
    if (r > 0) alleUm = false;
  }
  if (ende && alleUm) halt();
}
function los(){ ende = Date.now() + rest * 1000; gestartet = true; takt = setInterval(zeichneTimer, 250); knopfText('Pause'); zeichneTimer(); }
function halt(){ clearInterval(takt); takt = null; if (ende) rest = (ende - Date.now()) / 1000; ende = null;
  if (gestartet) knopfText('Weiter'); zeichneTimer(); }
function stelle(u, d){ if (d < 0 && restVon(u) + d < 60) return; u.extra += d; zeichneTimer(); }
function neuerTimer(){ halt(); baueUhren(aktuellerBlock()); uhrenFuer = uhrenSchluessel(aktuellerBlock());
  rest = basis; gestartet = false; gekoppelt = true; knopfText('Start'); synchron(); zeichneTimer(); einpassen(); }

// Der Timer laeuft mit der Uhr: Er beginnt um «Von» und endet nach seiner Dauer, auch wenn die
// Seite erst mitten im Block geoeffnet wird. Start, Pause oder -1/+1 uebernehmen von Hand,
// ↺ koppelt wieder an die Uhrzeit.
function synchron(){
  const b = E.bloecke[aktuellerBlock()], heute = iso(jetzt());
  vorStart = null;
  if (!gekoppelt || !b || !b.von) return;
  // Block an einem anderen Tag: ein noch laufender Timer vom vorigen Block wird zurueckgesetzt.
  if (b.datum && b.datum !== heute) { if (gestartet) neuerTimer(); return; }
  const beginn = new Date(`${heute}T${b.von}`).getTime() - versatz, soll = beginn + basis * 1000;
  if (Date.now() < beginn) {
    if (takt) halt();
    rest = basis; gestartet = false; vorStart = punkt(b.von); knopfText('Start');
  } else if (Date.now() < soll) {
    ende = soll; gestartet = true;
    if (!takt) { takt = setInterval(zeichneTimer, 250); knopfText('Pause'); }
  } else if (!takt) {
    rest = (soll - Date.now()) / 1000; gestartet = true;
  }
  zeichneTimer();
}

$('uhren').addEventListener('click', e => {
  const k = e.target.closest('[data-tat]'); if (!k) return;
  const u = uhren[k.closest('.timer').dataset.n];
  if (k.dataset.tat !== 'zurueck') gekoppelt = false;
  ({start: () => takt ? halt() : los(), minus: () => stelle(u, -60), plus: () => stelle(u, 60), zurueck: neuerTimer})[k.dataset.tat]();
});

function uhr(){
  $('jetzt').textContent = hhmm(jetzt());
  const i = aktuellerBlock();
  const k = uhrenSchluessel(i);
  if (k !== blockJetzt || (k !== uhrenFuer && !takt) || $('slot').dataset.tag !== iso(jetzt())) { zeichneSeite(); $('slot').dataset.tag = iso(jetzt()); }
  synchron();
}

// ---------- Einstellungsdialog ----------
const dlg = $('dialog'), form = $('formular');
const FARBEN = ['#0065a9', '#9867a5', '#007d57', '#a6083d', '#935100', '#6a1b9a'];
const neueId = () => 'm' + Math.random().toString(36).slice(2, 8);

function baueDialog(){
  const vordruckWahl = Object.entries(VORDRUCKE).map(([k, v]) => `<option value="${k}" ${k === (E.vordruck || VORGABE.vordruck) ? 'selected' : ''}>${esc(v.name)}</option>`).join('');

  const module = E.module.map((m, mi) => `
    <div class="modul" style="--m:${esc(m.farbe)}">
      <div class="zeile">
        <label>Kürzel<input data-m="${mi}" data-f="kuerzel" value="${esc(m.kuerzel)}" size="9" placeholder="MA01.03"></label>
        <label class="wachsen">Name<input data-m="${mi}" data-f="name" value="${esc(m.name)}" placeholder="Form und Raum"></label>
        <label>Farbe<input type="color" data-m="${mi}" data-f="farbe" value="${esc(m.farbe)}" list="farben"></label>
        <label>Dauer (Min.)<input type="number" min="1" max="600" data-m="${mi}" data-f="dauer" value="${m.dauer || ''}" placeholder="wie Block" style="width:96px"></label>
        <button type="button" class="x" data-tat="modulWeg" data-m="${mi}" title="Modul entfernen">✕</button>
      </div>
      <div class="hilfe">Hilfsmittel, eine Zeile pro Eintrag. Das Zeichen links umschalten: ✓ erlaubt · ✗ nicht erlaubt · → Hinweis.</div>
      ${m.hilfsmittel.map((h, hi) => `
        <div class="eintrag">
          <button type="button" class="art ${h.art}" data-tat="art" data-m="${mi}" data-h="${hi}" title="umschalten">${{ja:'✓', nein:'✗', hinweis:'→'}[h.art]}</button>
          <input data-m="${mi}" data-h="${hi}" value="${esc(h.text)}" placeholder="z. B. Taschenrechner">
          <button type="button" class="x" data-tat="zeileWeg" data-m="${mi}" data-h="${hi}" title="Zeile entfernen">✕</button>
        </div>`).join('')}
      <button type="button" class="d" data-tat="zeileDazu" data-m="${mi}">+ Zeile</button>
    </div>`).join('');

  const bloecke = E.bloecke.map((b, bi) => `
    <div class="block">
      <span class="nr" title="Taste ${bi + 1}">${bi + 1}</span>
      <label>Datum<input type="date" data-b="${bi}" data-f="datum" value="${esc(b.datum)}"></label>
      <label>Von<input type="time" data-b="${bi}" data-f="von" value="${esc(b.von)}"></label>
      <label>Bis<input type="time" data-b="${bi}" data-f="bis" value="${esc(b.bis)}"></label>
      <label>Timer (Min.)<input type="number" min="1" max="600" data-b="${bi}" data-f="dauer" value="${b.dauer || ''}" placeholder="${dauer({...b, dauer: null})}"></label>
      <div class="modwahl">${E.module.map(m => `<label><input type="checkbox" data-b="${bi}" data-mod="${m.id}" ${b.module.includes(m.id) ? 'checked' : ''}>${esc(m.kuerzel || m.name || 'Modul')}</label>`).join('')}</div>
      <button type="button" class="x" data-tat="blockWeg" data-b="${bi}" title="Block entfernen">✕</button>
    </div>`).join('');

  form.innerHTML = `
    <div class="d-kopf"><h2>Einstellungen</h2>
      <label style="flex-direction:row;align-items:center;gap:8px;font-size:14px">Vordruck <select id="vordruck">${vordruckWahl}</select></label></div>
    <div class="d-inhalt">
      <fieldset><legend>Titel</legend>
        <input data-f="titel" value="${esc(E.titel)}" style="width:100%" placeholder="Prüfung Teil A">
        <div class="hilfe">Hinter dem Titel stehen im Kopfstreifen die Namen der Module, die gerade schreiben.</div></fieldset>
      <fieldset><legend>Module und Hilfsmittel</legend>
        <div class="hilfe">Mit <b>**fett**</b> hervorheben. Eine Zeile, die mit «zusätzlich:» beginnt, wird automatisch hervorgehoben.
          Ab drei Prüfungen in einem Block stehen die Hilfsmittel in einem Kasten: Was alle gleich haben, einmal, der Rest mit dem Kürzel davor.
          Eine eigene Dauer gilt nur für diese Prüfung. Jede Dauer bekommt eine eigene Uhr (höchstens drei passen gut nebeneinander), darunter stehen gross die Kürzel der Prüfungen, die sie betrifft.</div>
        ${module}<button type="button" class="d" data-tat="modulDazu">+ Modul</button></fieldset>
      <fieldset><legend>Blöcke</legend>
        <div class="hilfe">Die Seite wechselt nach der Uhrzeit von selbst zum nächsten Block. Der Timer läuft mit der Uhr: Er beginnt um «Von» und übernimmt die Länge aus Von–Bis, ausser es steht eine eigene da. Start, Pause oder −1/+1 übernehmen von Hand, ↺ koppelt wieder an die Uhrzeit. Ohne Datum gilt ein Block jeden Tag. Tasten 1–9 wählen einen Block, 0 geht zurück zur Uhrzeit.</div>
        ${bloecke}<button type="button" class="d" data-tat="blockDazu" style="margin-top:8px">+ Block</button></fieldset>
      <fieldset><legend>Satz zum Hinsetzen</legend>
        <label style="display:flex;margin-bottom:8px">wenn ein Modul schreibt<textarea data-f="satzEins">${esc(E.satzEins)}</textarea></label>
        <label style="display:flex">wenn mehrere Module schreiben<textarea data-f="satzMehrere">${esc(E.satzMehrere)}</textarea></label>
        <div class="hilfe">{module} wird ersetzt durch die Kürzel, z. B. «MA01.03 und MA01.07». **fett** wird hervorgehoben.</div></fieldset>
      <fieldset><legend>Kärtchen unten</legend>
        <div class="hilfe">Eine Zeile pro Kärtchen. [Text in eckigen Klammern] steht im Kästchen, z. B. [Name · A1 · S. 2/3].</div>
        ${E.kaertchen.map((k, ki) => `<div class="eintrag"><input data-k="${ki}" value="${esc(k)}"><button type="button" class="x" data-tat="kaertchenWeg" data-k="${ki}" title="Kärtchen entfernen">✕</button></div>`).join('')}
        <button type="button" class="d" data-tat="kaertchenDazu">+ Kärtchen</button></fieldset>
    </div>
    <div class="d-fuss"><span class="meldung" id="meldung"></span>
      <button type="button" class="d" data-tat="zurueckVorgabe" title="Einstellungen verwerfen, Vorgabe dieser Datei laden">Zurück zur Vorgabe</button>
      <button type="button" class="d" data-tat="datei" title="Kopie dieser Seite mit den jetzigen Einstellungen als Vorgabe">Als Datei speichern</button>
      <button class="d haupt" value="ok">Fertig</button></div>
    <datalist id="farben">${FARBEN.map(f => `<option value="${f}">`).join('')}</datalist>`;
}

function aendern(){ merken(); zeichneSeite(); }
function neuAufbauen(){ const y = form.querySelector('.d-inhalt')?.scrollTop; baueDialog(); form.querySelector('.d-inhalt').scrollTop = y || 0; aendern(); }

form.addEventListener('input', e => {
  const t = e.target, d = t.dataset;
  if (t.id === 'vordruck') return;
  if (d.k !== undefined) E.kaertchen[d.k] = t.value;
  else if (d.mod) { const b = E.bloecke[d.b]; b.module = t.checked ? [...new Set([...b.module, d.mod])] : b.module.filter(x => x !== d.mod); }
  else if (d.h !== undefined) E.module[d.m].hilfsmittel[d.h].text = t.value;
  else if (d.m !== undefined) { E.module[d.m][d.f] = d.f === 'dauer' ? (parseInt(t.value) || null) : t.value; if (d.f === 'farbe') t.closest('.modul').style.setProperty('--m', t.value); }
  else if (d.b !== undefined) {
    const b = E.bloecke[d.b];
    b[d.f] = d.f === 'dauer' ? (parseInt(t.value) || null) : t.value;
    const feld = t.closest('.block').querySelector('[data-f=dauer]'); feld.placeholder = dauer({...b, dauer: null});
  }
  else if (d.f) E[d.f] = t.value;
  aendern();
});
form.addEventListener('change', e => {
  const t = e.target;
  // Die Auswahl zeigt immer, welcher Vordruck gerade gilt; ein Wechsel greift sofort.
  if (t.id === 'vordruck') {
    const v = VORDRUCKE[t.value];
    if (!confirm(`Alle Einstellungen durch den Vordruck «${v.name}» ersetzen?`)) { t.value = E.vordruck || VORGABE.vordruck; return; }
    E = {...kopie(v.einstellungen), vordruck: t.value}; gewaehlt = null; neuAufbauen();
  }
  else if (d_kuerzelGeaendert(t)) neuAufbauen();
});
// Die Modulnamen stehen auch bei den Bloecken; nach dem Tippen dort nachziehen.
const d_kuerzelGeaendert = t => t.dataset.m !== undefined && (t.dataset.f === 'kuerzel' || t.dataset.f === 'name');

form.addEventListener('click', e => {
  const t = e.target.closest('[data-tat]'); if (!t) return;
  const d = t.dataset, m = E.module[d.m];
  switch (d.tat) {
    case 'art': { const h = m.hilfsmittel[d.h]; h.art = {ja: 'nein', nein: 'hinweis', hinweis: 'ja'}[h.art]; break; }
    case 'zeileDazu': m.hilfsmittel.push({art: 'ja', text: ''}); break;
    case 'zeileWeg': m.hilfsmittel.splice(d.h, 1); break;
    case 'modulDazu': E.module.push({id: neueId(), kuerzel: '', name: '', farbe: FARBEN[E.module.length % FARBEN.length], hilfsmittel: [{art: 'ja', text: ''}]}); break;
    case 'modulWeg':
      if (!confirm(`Modul «${m.kuerzel || m.name || 'ohne Namen'}» entfernen?`)) return;
      E.bloecke.forEach(b => b.module = b.module.filter(x => x !== m.id)); E.module.splice(d.m, 1); break;
    case 'blockDazu': { const l = E.bloecke.at(-1); E.bloecke.push(l ? {...kopie(l), von: l.bis, bis: ''} : {datum: '', von: '', bis: '', dauer: null, module: E.module.map(x => x.id)}); break; }
    case 'blockWeg': E.bloecke.splice(d.b, 1); gewaehlt = null; break;
    case 'kaertchenDazu': E.kaertchen.push(''); break;
    case 'kaertchenWeg': E.kaertchen.splice(d.k, 1); break;
    case 'zurueckVorgabe':
      if (!confirm('Alle Änderungen verwerfen und die Vorgabe dieser Datei laden?')) return;
      E = {...kopie(VORGABE.einstellungen), vordruck: VORGABE.vordruck}; gewaehlt = null; break;
    case 'datei': alsDatei(); return;
  }
  neuAufbauen();
});

// Kopie der Seite mit den jetzigen Einstellungen als neuer Vorgabe. Nur der JSON-Block wird ersetzt.
function alsDatei(){
  const alt = $('vorgabe').textContent, i = ROH.indexOf(alt);
  const neu = JSON.stringify({id: 'v' + Date.now().toString(36), einstellungen: E}).replace(/</g, '\\u003c');
  const html = ROH.slice(0, i) + neu + ROH.slice(i + alt.length);
  const name = 'Beamer-' + (E.titel || 'Pruefung').replace(/[äöü]/gi, c => ({ä:'ae',ö:'oe',ü:'ue',Ä:'Ae',Ö:'Oe',Ü:'Ue'}[c])).normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^\w]+/g, '-').replace(/^-|-$/g, '') + '.html';
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], {type: 'text/html'})); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function oeffneDialog(){ if (dlg.open) return; baueDialog(); dlg.showModal(); }
$('zahnrad').onclick = oeffneDialog;
dlg.addEventListener('close', () => { $('zahnrad').blur(); einpassen(); });

document.addEventListener('keydown', e => {
  if (dlg.open || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === ' ') { e.preventDefault(); gekoppelt = false; takt ? halt() : los(); }
  else if (e.key === 'e' || e.key === 'E') { e.preventDefault(); oeffneDialog(); }
  else if (e.key === 'f' || e.key === 'F') document.documentElement.requestFullscreen?.();
  else if (e.key === '0') { gewaehlt = null; zeichneSeite(); }
  else if (/^[1-9]$/.test(e.key) && E.bloecke[e.key - 1]) { gewaehlt = e.key - 1; zeichneSeite(); }
});

zeichneSeite(); uhr(); setInterval(uhr, 1000);
if (!BEISPIEL) oeffneDialog();
</script>
